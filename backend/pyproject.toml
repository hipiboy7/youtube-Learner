[project]
name = "youtube-learner"
version = "0.1.0"
description = "youtubeLearner 백엔드 — 유튜브 채널 롱폼·숏폼 목록 + 스크립트 추출 (자막 → 로컬 faster-whisper)"
# Python 3.12 고정 — ctranslate2·onnxruntime·av 휠 확인(TechSpike 3.8절), PyInstaller 성숙도. 3.14는 CLAUDE.md 보류 결정 4.
requires-python = ">=3.12,<3.13"

# CLAUDE.md 7절 — 의존성은 하한·상한 고정. 기본 의존성은 P0 공통 모듈이 쓰는 것만.
dependencies = [
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0.30,<2.1",
]

[project.optional-dependencies]
# Phase 1~2 — 유튜브 접근 (yt-dlp는 YouTube 변경이 잦아 상한을 두지 않고 설정에서 갱신 가능하게 둔다 — CLAUDE.md 7절)
youtube = [
    "yt-dlp[default]>=2026.8.19",
    "bgutil-ytdlp-pot-provider>=2.0,<3.0",
    "youtube-transcript-api>=1.2,<2.0",
]
# Phase 2 — 음성 인식 (CPU int8). PyAV·ctranslate2·onnxruntime은 faster-whisper가 끌어온다.
stt = [
    "faster-whisper>=1.2,<2.0",
]
# Phase 1~3 — API 서버
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]
# Phase 2 — 작업 큐 (SQLite 백엔드, Windows는 thread worker)
jobs = [
    "huey>=2.5,<3.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# tests/unit = 등급 A, tests/integration = 등급 B (CLAUDE.md 3절)
testpaths = ["tests"]
pythonpath = ["src"]
# 실호출 E2E는 기본 실행에서 제외한다 (CLAUDE.md 3절).
# 외부 서비스(YouTube)가 막히면 관계없는 변경도 빨간불이 되고, 그러면 실패를 무시하기 시작한다.
# 무시되는 관문은 없는 것보다 나쁘다.
#   실행: backend\.venv\Scripts\python.exe -m pytest tests/e2e -m e2e -v
addopts = "-q -m 'not e2e'"
markers = [
    "e2e: 실제 YouTube·Whisper를 호출한다. scripts\\check_env.ps1 READY 와 네트워크가 필요하다",
]

[tool.coverage.run]
source = ["youtube_learner"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# Protocol 선언만 있는 모듈은 실행 로직이 없어 커버리지 측정 대상이 아니다 (설계서 5.2절)
omit = ["*/domain/interfaces.py"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
